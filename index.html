<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>3D Glassmorphism Card</title>
</head>
<body>
    <div class="container">
        <article class="card_articale">
            <img src="./yuva.png" alt="yuva" class="card_img">
            <div class="card_overlay"></div>
            <div class="card_data">
                <span class="card_description">Front-End Developer || Designer, Artist</span>
                <h2 class="card_title">@yuva_artistry2k</h2>
                <a href="https://www.instagram.com/yuva_artistry2k/" class="card_btn">Follow</a>
            </div>
        </article>
        <article class="card_articale">
            <img src="./prakash.png" alt="Hello_mr_prakash" class="card_img">
            <div class="card_overlay"></div>
            <div class="card_data">
                <span class="card_description">Full-stack developer || Designer</span>
                <h2 class="card_title">@hello_mr_prakash</h2>
                <a href="https://www.instagram.com/hello_mr_prakash/" class="card_btn">Follow</a>
            </div>
        </article>
    </div>
</body>
</html>
